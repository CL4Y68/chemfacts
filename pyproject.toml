[project]
name = "chemfacts"
version = "0.1.0"
description = "Provenance-first chemical fact verification: query PubChem, cross-check sources, never fabricate. Export auditable, citable fact cards."
readme = "README.md"
authors = [
    { name = "CL4Y68" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests>=2.34.2",
    "typer>=0.27.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/CL4Y68/chemfacts"
Repository = "https://github.com/CL4Y68/chemfacts"
Issues = "https://github.com/CL4Y68/chemfacts/issues"

[project.scripts]
chemfacts = "chemfacts.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 is a false positive for Typer: typer.Option(...) in parameter defaults is the
# framework's documented pattern.
"src/chemfacts/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real PubChem API (deselect with '-m \"not live\"')",
]
